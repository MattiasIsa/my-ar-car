<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<model-viewer 
  src="your-model.glb" 
  ios-src="your-model.usdz"
  ar 
  ar-modes="webxr scene-viewer quick-look" 
  camera-controls 
  shadow-intensity="1" 
  style="width: 100%; height: 100vh;">
  <button slot="ar-button" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px;">
    🚀 View in my Room
  </button>
</model-viewer>
