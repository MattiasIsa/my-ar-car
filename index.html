<!DOCTYPE html>
<html>
<head>
    <title>AR Humvee Experience</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        model-viewer { width: 100vw; height: 100vh; }

        /* GIANT PULSING BUTTON */
        .hotspot {
            width: 80px; 
            height: 80px; 
            border-radius: 50%;
            border: 4px solid #fff;
            background-color: #ff0000;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.9);
            animation: giant-pulse 1.5s infinite;
        }

        @keyframes giant-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; box-shadow: 0 0 60px rgba(255, 0, 0, 1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .hotspot-label {
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 18px;
            color: black;
            border: 2px solid red;
        }

        /* Video Overlay */
        #video-container {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95%;
            max-width: 800px;
            z-index: 1000;
            background: #000;
            border: 3px solid #ff0000;
        }

        #close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            background: red;
            color: white;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .ar-button {
            background: white;
            border-radius: 30px;
            padding: 15px 30px;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            border: 2px solid #000;
        }
    </style>
</head>
<body>

    <model-viewer 
        id="model"
        src="destroyed_hmmwv_humvee_m1114_in_ukraine.glb" 
        ios-src="Destroyed_HMMWV_Humvee_M1114_in_Ukraine.usdz"
        ar ar-modes="scene-viewer quick-look" ar-placement="floor"
        camera-controls shadow-intensity="2" exposure="1">
        
        <button class="hotspot" slot="hotspot-main" data-position="0m 1m 2.5m" data-normal="0m 0m 1m" onclick="openVid()">
            <div class="hotspot-label">CLICK TO PLAY VIDEO</div>
        </button>

        <button slot="ar-button" class="ar-button">🚀 OPEN AR MODE</button>
    </model-viewer>

    <div id="video-container">
        <div id="close-btn" onclick="closeVid()">CLOSE X</div>
        <div style="padding-top: 56.25%; position: relative;">
            <iframe id="player" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
            src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function openVid() {
            const container = document.getElementById('video-container');
            const player = document.getElementById('player');
            player.src = "https://www.youtube.com/embed/vFRSiQGNZFo?autoplay=1";
            container.style.display = 'block';
        }
        function closeVid() {
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('player').src = "";
        }
    </script>

</body>
</html>
