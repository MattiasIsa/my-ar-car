<!DOCTYPE html>
<html>
<head>
    <title>AR Humvee Test</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #222;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="destroyed_hmmwv_humvee_m1114_in_ukraine.glb" 
        ios-src="Destroyed_HMMWV_Humvee_M1114_in_Ukraine.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1"
        auto-rotate>
        
        <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px;">
          👋 View in your Space
        </button>

    </model-viewer>

</body>
</html>
