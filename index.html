<!DOCTYPE html>
<html>
<head>
    <title>Framed AR Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { 
            background-color: #f0f0f0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }

        /* This is your frame */
        .model-container {
            width: 90%;
            max-width: 500px; /* Limits the width */
            height: 400px;    /* Fixed height for the frame */
            border: 5px solid #333;
            border-radius: 15px;
            overflow: hidden;
            background: #222;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .custom-ar-button {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>Vehicle Inspection</h1>
    <p>Check the damaged Humvee below. Click the AR icon to see it in your room.</p>

    <div class="model-container">
        <model-viewer 
            src="destroyed_hmmwv_humvee_m1114_in_ukraine.glb" 
            ios-src="Destroyed_HMMWV_Humvee_M1114_in_Ukraine.usdz"
            ar 
            ar-modes="scene-viewer quick-look" 
            camera-controls 
            auto-rotate>
            
            <button slot="ar-button" class="custom-ar-button">
                View in AR 🎥
            </button>
        </model-viewer>
    </div>

    <p style="margin-top: 20px;">Detailed damage report follows here...</p>

</body>
</html>
