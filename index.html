<!DOCTYPE html>
<html>
<head>
    <title>Humvee AR Experience</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #111; }
        
        model-viewer {
            width: 100vw;
            height: 100vh;
        }

        /* THE TRICK: This button covers the whole screen and is transparent */
        #invisible-ar-button {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4); /* Dim the background slightly */
            border: none;
            cursor: pointer;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Animation for the "Tap" icon */
        .tap-icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: tap-pulse 1.5s infinite;
        }

        @keyframes tap-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .instruction {
            font-weight: bold;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <model-viewer 
        id="model"
        src="destroyed_hmmwv_humvee_m1114_in_ukraine.glb" 
        ios-src="Destroyed_HMMWV_Humvee_M1114_in_Ukraine.usdz"
        ar 
        ar-modes="scene-viewer quick-look" 
        ar-placement="floor"
        camera-controls 
        shadow-intensity="2">
        
        <button slot="ar-button" id="invisible-ar-button">
            <div class="tap-icon">👆</div>
            <div class="instruction">Tap to start AR</div>
        </button>

    </model-viewer>

</body>
</html>
