<!DOCTYPE html>
<html>
<head>
    <title>AR Humvee Experience</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #222; }
        model-viewer { width: 100vw; height: 100vh; }

        .ar-button {
            background: white;
            border-radius: 30px;
            padding: 15px 30px;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            border: 2px solid #000;
            z-index: 100;
        }

        .hotspot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background-color: #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <model-viewer 
        id="model"
        src="destroyed_hmmwv_humvee_m1114_in_ukraine.glb" 
        ios-src="Destroyed_HMMWV_Humvee_M1114_in_Ukraine.usdz"
        ar 
        ar-modes="scene-viewer quick-look webxr" 
        ar-placement="floor"
        camera-controls
        shadow-intensity="2">
        
        <button class="hotspot" slot="hotspot-video" 
                data-position="0m 1.5m 2m" 
                data-normal="0m 0m 1m" 
                onclick="location.href='https://www.youtube.com/watch?v=vFRSiQGNZFo'">
            PLAY
        </button>

        <button slot="ar-button" class="ar-button">🚀 START AR CAMERA</button>
    </model-viewer>

    <script>
        // This script handles the 'click' inside the web view
        // The 'onclick' attribute on the button handles it in Scene Viewer (Android)
        document.querySelector(".hotspot").addEventListener("click", () => {
            window.open("https://www.youtube.com/watch?v=vFRSiQGNZFo", "_blank");
        });
    </script>

</body>
</html>
